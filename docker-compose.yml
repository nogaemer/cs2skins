version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: cs2skins_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: cs2skins
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d cs2skins"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
